[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
dynamic = ["version"]
description = "An offline personal finance tracker with a text menu and a tkinter window."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Aaron Light" }]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "ledger.__version__" }
